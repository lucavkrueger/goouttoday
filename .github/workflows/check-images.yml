name: Check images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/check_images.py', '.github/workflows/check-images.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python .github/scripts/check_images.py
      - name: Publish report to image-report branch
        run: |
          cd report
          git init -q -b image-report
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Image report"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" image-report
