name: Localize images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/localize_images.py', '.github/workflows/localize-images.yml']
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - run: python .github/scripts/localize_images.py
      - name: Publish to images branch
        run: |
          cd out
          git init -q -b images
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Localized images"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" images
